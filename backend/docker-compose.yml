version: '3.8'
services:
  # 🟢 Service 1: Node.js (Main Backend)
  api:
    build:
      context: .
      dockerfile: Dockerfile # ใช้ Dockerfile ของ Node ที่แก้ไปก่อนหน้านี้
    ports:
      - "3003:3003"
    volumes:
      - ./data:/app/data
    environment:
      - PYTHON_API_URL=http://python_nlp:5001 # บอก Node ว่า Python อยู่ไหน
      - LARK_APP_ID=cli_a9f6e14d6f381ed2
      - LARK_APP_SECRET=PoZAUcaQeypNSUIJBwUr7g8jMyohnp0C
      - LARK_BASE_TOKEN=TZTmbSaLva5U9rs8uEnlaHzGgjd
      - LARK_TABLE_ID=tblBEdpZE5OMDZgy
    depends_on:
      - python_nlp

  # 🟢 Service 2: Python (NLP Tokenizer)
  python_nlp:
    build:
      context: .
      dockerfile: Dockerfile.python # ใช้ Dockerfile.python ที่เพิ่งสร้าง
    ports:
      - "5001:5001"